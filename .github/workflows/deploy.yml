# Builds the site and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repository:  Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# After that, pushing a change to countries/<id>/*.json (a new rate, a new revenue figure, a new country)
# rebuilds and republishes the site. The build fails, and nothing is published, if the data does not
# validate or a test fails.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate country data
        run: npm run validate
      - name: Unit tests
        run: npm test
      - name: Build (relative paths, works in a sub-folder)
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
